<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <title>Iara Games</title>

    <link rel="stylesheet" href="build/css/main.css">
</head>

<body>
    <section class="container py-5">

        <div class="row g-3">
            <div class="col-6 col-md-4 col-lg-3">
                <article class="game-card">

                    <img src="/public/images/sertao-profundo.webp" class="game-card__image"
                        alt="Paisagem do jogo Sertão Profundo">

                    <span class="game-card__category">
                        RPG
                    </span>

                    <div class="game-card__content">

                        <h3 class="game-card__title">
                            Sertão Profundo
                        </h3>

                        <div class="game-card__rating" aria-label="5 de 5 estrelas">
                            ★★★★★
                        </div>

                        <div class="game-card__pricing">

                            <span class="game-card__discount">
                                -30%
                            </span>

                            <span class="game-card__price">
                                R$ 55,90
                            </span>

                            <span class="game-card__old-price">
                                R$ 79,90
                            </span>

                        </div>

                    </div>

                </article>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <article class="game-card">

                    <img src="/public/images/sertao-profundo.webp" class="game-card__image"
                        alt="Paisagem do jogo Sertão Profundo">

                    <span class="game-card__category">
                        RPG
                    </span>

                    <div class="game-card__content">

                        <h3 class="game-card__title">
                            Sertão Profundo
                        </h3>

                        <div class="game-card__rating" aria-label="5 de 5 estrelas">
                            ★★★★★
                        </div>

                        <div class="game-card__pricing">

                            <span class="game-card__discount">
                                -30%
                            </span>

                            <span class="game-card__price">
                                R$ 55,90
                            </span>

                            <span class="game-card__old-price">
                                R$ 79,90
                            </span>

                        </div>

                    </div>

                </article>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <!-- Terceiro game-card -->
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <!-- Quarto game-card -->
            </div>

        </div>

    </section>


    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
