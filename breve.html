<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="build/css/main.css">

    <title>Iara Games - Em Breve</title>
</head>

<body>

    <div class="coming-soon-page min-vh-100 d-flex flex-column">

        <!-- PATTERN SUPERIOR -->
        <div class="bg-pattern-indigena coming-soon-pattern border-bottom"></div>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-grow-1 d-flex flex-column align-items-center justify-content-center text-center gap-4 py-5 px-3">

            <img
                class="coming-soon-image img-fluid"
                src="public/images/em-breve.webp"
                alt="Imagem de uma mulher indígena dentro da água em formato minimalista nas cores verde e amarelo"
            />

            <span class="coming-soon-label text-title-secondary body-semibold-xs text-uppercase">
                Em breve
            </span>

            <h1 class="headlines-h1 text-title-neutral text-uppercase mb-0">
                Estamos construindo algo
                <span class="text-brand-green-400">incrível</span>
            </h1>

            <div class="coming-soon-description">
                <p class="body-regular-lg text-body mb-0">
                    Estamos preparando algo especial para você. Esta seção ainda está
                    sendo construída — volte em breve para conferir as novidades.
                </p>
            </div>

            <a href="index.html" class="btn btn-iara-secondary mt-2">
                <span class="ui-icon icon-arrow-left" aria-hidden="true"></span>
                Voltar ao início
            </a>

        </main>

        <!-- PATTERN INFERIOR -->
        <div class="bg-pattern-indigena coming-soon-pattern border-top"></div>

    </div>

</body>
</html>
